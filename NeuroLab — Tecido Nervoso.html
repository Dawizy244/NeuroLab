<canvas id="nn"></canvas>
<header><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><b style="font-size:1.35rem">🧠 NeuroLab</b><input type="text" id="sq" placeholder="🔎 O que você quer estudar?" oninput="srch(this.value)" style="flex:1;min-width:200px"><div style="min-width:190px"><div class="m" id="xl" style="font-size:.85rem"></div><div class="bar"><i id="xb"></i></div></div></div><nav id="nv"></nav></header>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),nm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(),shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),fmtT=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
const TP=["Tecido nervoso","Neurônio","Impulso","Sinapse","Glia","Sistema nervoso"];
let S={xp:0,done:{},fc:{},q:{},time:0,streak:0,last:"",sims:[],pl:[],mod:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("nl1")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("nl1",JSON.stringify(S))}catch(e){}};
(()=>{const f=d=>d.toLocaleDateString("sv"),t=f(new Date()),y=new Date();y.setDate(y.getDate()-1);if(S.last!=t){S.streak=S.last==f(y)?S.streak+1:1;S.last=t;sv()}})();
const LV=[[0,"Célula iniciante"],[100,"Explorador biológico"],[250,"Pesquisador"],[450,"Neurocientista"],[700,"Mestre da Biologia"]];
function lv(){let i=0;LV.forEach((l,k)=>{if(S.xp>=l[0])i=k});const n=LV[i+1];return{i,n:LV[i][1],p:n?(S.xp-LV[i][0])/(n[0]-LV[i][0])*100:100}}
function hdr(){const L=lv();$("#xl").textContent=`Nível ${L.i+1} — ${L.n} • ${S.xp} XP`;$("#xb").style.width=L.p+"%"}
const addXP=n=>{S.xp+=n;sv();hdr()};
/* ---------- conteúdo ---------- */
const PN={d:["Dendritos","Ramificações curtas que recebem estímulos e informações de outras células."],c:["Corpo celular","Contém o núcleo e as organelas e comanda as atividades do neurônio."],n:["Núcleo","Guarda o material genético (DNA) e controla a célula."],a:["Axônio","Conduz o impulso nervoso para outras células."],m:["Bainha de mielina","Capa de gordura que isola o axônio e acelera o impulso nervoso."],t:["Terminações do axônio","Liberam neurotransmissores (mensageiros químicos) na sinapse."]};
const M=[
{t:"Tecido nervoso",f:"O tecido nervoso é formado por neurônios (células que recebem e conduzem sinais) e células da glia (que sustentam, nutrem e protegem os neurônios). Sua função principal é receber estímulos (mudanças no ambiente), interpretá-los e coordenar respostas. É essencial para sentir, pensar, se movimentar e manter o equilíbrio interno do corpo (homeostase).",e:"Imagine o corpo como uma cidade: o tecido nervoso é a rede de telefonia. Os neurônios levam mensagens rápidas (“está quente!”, “mexa a mão!”) e a glia é a equipe de apoio que cuida deles. Sem isso, você não sentiria nem reagiria a nada."},
{t:"Neurônio",f:"O neurônio é a célula especializada em conduzir impulsos nervosos. Suas partes: dendritos (ramificações que recebem estímulos), corpo celular (onde fica o núcleo; comanda a célula), axônio (prolongamento longo que conduz o impulso), bainha de mielina (capa de gordura que isola o axônio e acelera o impulso) e terminações do axônio (liberam neurotransmissores). Clique nas partes do diagrama!",e:"O neurônio parece uma árvore: os dendritos são os galhos que captam a mensagem, o corpo celular é o “chefe” com o núcleo, o axônio é o fio comprido que leva a mensagem e as terminações a entregam ao próximo. A mielina é a capinha que faz o fio funcionar mais rápido."},
{t:"Impulso nervoso",f:"Estímulo é qualquer mudança no ambiente detectada pelo organismo. Ele gera um impulso nervoso: sinal elétrico que percorre a membrana do neurônio sempre no mesmo sentido — dendritos → corpo celular → axônio → terminações. A bainha de mielina acelera o impulso, que “salta” pelos nódulos de Ranvier (pequenos espaços sem mielina).",e:"É como dominós caindo em fila: você toca algo quente (estímulo), o sinal corre pelo neurônio sempre no mesmo caminho e chega ao fim. Com a mielina, o sinal dá pulinhos em vez de andar passo a passo — por isso chega mais rápido."},
{t:"Sinapse",f:"Sinapse é a região de comunicação entre um neurônio e outra célula. Na sinapse química, o terminal axônico libera neurotransmissores (substâncias químicas mensageiras) no espaço sináptico (pequeno intervalo entre as células). Eles se ligam a receptores (moléculas que “encaixam” neles) no neurônio seguinte, podendo gerar um novo impulso.",e:"Os neurônios não se encostam: há um vãozinho entre eles. Para passar a mensagem, o primeiro joga “bilhetinhos químicos” (neurotransmissores) nesse vão, e o segundo os pega com seus receptores, como uma fechadura que recebe a chave certa."},
{t:"Células da glia",f:"As células da glia (neuroglia) não conduzem impulsos como os neurônios, mas são indispensáveis: astrócitos (nutrição e sustentação), oligodendrócitos (mielina no SNC), células de Schwann (mielina no SNP) e micróglia (defesa). Clique nos cards.",e:"Se os neurônios são os jogadores, a glia é a comissão técnica: alimenta, protege, isola os fios (mielina) e faz a defesa e a limpeza."},
{t:"Sistema nervoso",f:"O sistema nervoso divide-se em SNC (sistema nervoso central: encéfalo e medula espinhal), que processa e comanda, e SNP (sistema nervoso periférico: nervos e gânglios), que liga o SNC ao resto do corpo. Clique no esquema.",e:"O SNC é a “central de comando” (cérebro e medula). O SNP são os “fios” que levam e trazem mensagens entre a central e o corpo todo."}];
const GL=[["Astrócitos","Sustentam e nutrem os neurônios e regulam o ambiente químico ao redor deles.","SNC (encéfalo e medula espinhal)","O nome vem de “astro” (estrela), pelo formato."],["Oligodendrócitos","Produzem a bainha de mielina dos axônios.","SNC","Um só oligodendrócito pode envolver axônios de vários neurônios."],["Células de Schwann","Produzem a bainha de mielina dos axônios.","SNP (nervos)","Ajudam na regeneração de nervos periféricos lesionados."],["Micróglia","Defendem o tecido: englobam e destroem microrganismos e restos celulares (fagocitose).","SNC","São chamadas de “macrófagos do sistema nervoso” e são as menores células da glia."]];
const SN=[["Sistema nervoso","Recebe informações, processa e envia respostas, integrando as funções do corpo."],["SNC","Sistema nervoso central: processa as informações e comanda as respostas. Formado por encéfalo e medula espinhal."],["Encéfalo","Protegido pelo crânio; reúne cérebro, cerebelo e tronco encefálico. Controla pensamento, memória, emoções, movimentos e funções vitais."],["Medula espinhal","Dentro da coluna vertebral; conduz impulsos entre o encéfalo e o corpo e comanda atos reflexos (respostas rápidas e involuntárias)."],["SNP","Sistema nervoso periférico: liga o SNC ao corpo, levando estímulos ao SNC e respostas aos órgãos. Formado por nervos e gânglios."],["Nervos","Feixes de prolongamentos de neurônios que conduzem impulsos entre o SNC e o corpo."],["Gânglios","Aglomerados de corpos celulares de neurônios localizados fora do SNC."]];
const B=[["Neurônio","Dendritos (recebem) → corpo celular com núcleo → axônio (conduz) com bainha de mielina → terminações (liberam neurotransmissores).",1,110,70],["Impulso nervoso","Estímulo → impulso. Sentido único: dendritos → corpo celular → axônio → terminações. A mielina acelera o impulso (nódulos de Ranvier).",2,320,45],["Sinapse","O terminal axônico libera neurotransmissores no espaço sináptico; os receptores do neurônio seguinte os captam.",3,530,70],["Células da glia","Astrócitos (nutrição e sustentação), oligodendrócitos (mielina no SNC), células de Schwann (mielina no SNP) e micróglia (defesa).",4,110,330],["Sistema nervoso","SNC = encéfalo + medula espinhal. SNP = nervos + gânglios.",5,320,355],["Funções","Receber estímulos, processar informações, coordenar respostas e manter o equilíbrio do corpo (homeostase).",0,530,330]];
const C=[["Qual é a função dos dendritos?","Receber estímulos e informações.",1],["Qual é a função do axônio?","Conduzir o impulso nervoso para outras células.",1],["Onde fica o núcleo do neurônio?","No corpo celular.",1],["Qual é a função da bainha de mielina?","Isolar o axônio e acelerar o impulso nervoso.",1],["Qual é a função das terminações do axônio?","Liberar neurotransmissores.",3],["Qual o sentido do impulso nervoso?","Dendritos → corpo celular → axônio → terminações.",2],["O que é estímulo?","Mudança no ambiente (interno ou externo) detectada pelo organismo.",2],["O que é sinapse?","A região de comunicação entre um neurônio e outra célula.",3],["O que são neurotransmissores?","Substâncias químicas que levam o sinal pelo espaço sináptico.",3],["O que é o espaço sináptico?","O pequeno intervalo entre dois neurônios que se comunicam.",3],["O que são receptores?","Moléculas do neurônio seguinte que se ligam aos neurotransmissores.",3],["Qual a função dos astrócitos?","Sustentação e nutrição dos neurônios.",4],["Quem produz mielina no SNC?","Os oligodendrócitos.",4],["Quem produz mielina no SNP?","As células de Schwann.",4],["Qual a função da micróglia?","Defesa do SNC (fagocitose).",4],["O SNC é formado por quais estruturas?","Encéfalo e medula espinhal.",5],["O SNP é formado por quais estruturas?","Nervos e gânglios.",5],["O que são gânglios?","Aglomerados de corpos celulares de neurônios fora do SNC.",5],["O que são os nódulos de Ranvier?","Espaços sem mielina onde o impulso “salta”.",2],["Qual a função principal do tecido nervoso?","Receber estímulos, processá-los e coordenar as respostas do corpo.",0]];
const QB=[];const Q_=(t,d,q,o,a,w,tip,hl,ty)=>QB.push({id:QB.length,t:TP[t],d,q,o,a,w,tip,hl,ty});
const VF=["Verdadeiro","Falso"];
Q_(0,1,"Qual é a principal função do tecido nervoso?",["Transportar oxigênio","Receber estímulos, processá-los e enviar respostas","Produzir hormônios","Armazenar gordura"],1,"O tecido nervoso capta informações, interpreta e comanda respostas. O transporte de oxigênio é função do sangue.","Nervoso = comunicação e comando.");
Q_(1,1,"Qual é o nome da estrutura destacada no neurônio?",["Axônio","Dendritos","Núcleo","Bainha de mielina"],1,"Os dendritos são ramificações curtas que recebem estímulos.","“Dendron” = árvore: parecem galhos.","d");
Q_(1,1,"Os neurônios são as células responsáveis por conduzir o impulso nervoso.",VF,0,"Conduzir impulsos é justamente a especialidade do neurônio.","Neurônio = condutor de impulsos.",0,"vf");
Q_(1,1,"Qual parte do neurônio contém o núcleo?",["Corpo celular","Axônio","Dendrito","Bainha de mielina"],0,"O núcleo fica no corpo celular, que comanda a célula.","Corpo = “sede” da célula, onde mora o núcleo.");
Q_(2,1,"O impulso nervoso percorre o neurônio no sentido:",["axônio → corpo → dendritos","dendritos → corpo celular → axônio","corpo → dendritos → axônio","terminações → axônio → dendritos"],1,"O impulso entra pelos dendritos, passa pelo corpo celular e sai pelo axônio até as terminações.","D-C-A-T: Dendritos, Corpo, Axônio, Terminações.");
Q_(3,1,"Como se chama o espaço entre dois neurônios que se comunicam?",["Espaço sináptico","Axônio","Gânglio","Bainha de mielina"],0,"O pequeno intervalo entre as células na sinapse é o espaço sináptico.","Sinapse = ponte; o espaço é o “vão” da ponte.");
Q_(4,1,"Qual grupo de células dá suporte e proteção aos neurônios?",["Hemácias","Células da glia","Plaquetas","Células musculares"],1,"A glia sustenta, nutre e protege os neurônios.","Glia = “cola” (apoio) do tecido nervoso.");
Q_(5,1,"O SNC (sistema nervoso central) é formado por:",["Nervos e gânglios","Encéfalo e medula espinhal","Cérebro e nervos","Medula e gânglios"],1,"SNC = encéfalo + medula espinhal. Nervos e gânglios formam o SNP.","Central = Cérebro (encéfalo) + Coluna (medula).");
Q_(1,1,"Associe: o axônio tem a função de…",["Receber estímulos","Conduzir o impulso para outras células","Fabricar mielina","Defender o SNC"],1,"O axônio é o prolongamento longo que conduz o impulso para outras células.","Axônio = “autoestrada” do impulso.");
Q_(2,1,"O impulso nervoso pode ir das terminações do axônio em direção aos dendritos do mesmo neurônio.",VF,1,"O impulso tem sentido único: dendritos → corpo → axônio → terminações.","Sentido único, sem marcha à ré.",0,"vf");
Q_(1,2,"Qual estrutura está destacada no neurônio?",["Bainha de mielina","Núcleo","Terminações do axônio","Dendritos"],0,"As “capinhas” ao longo do axônio são a bainha de mielina.","Mielina = capa isolante, como a de um fio elétrico.","m");
Q_(1,2,"Qual é a função da bainha de mielina?",["Produzir neurotransmissores","Isolar o axônio e acelerar o impulso","Receber estímulos","Guardar o núcleo"],1,"A mielina isola o axônio e faz o impulso “saltar”, tornando a condução mais rápida.","Mielina = velocidade.");
Q_(3,2,"Substâncias químicas liberadas no espaço sináptico são chamadas de:",["Neurotransmissores","Anticorpos","Enzimas digestivas","Glicogênio"],0,"Os neurotransmissores levam a mensagem de um neurônio ao seguinte.","Neuro + transmissor = transmite a mensagem.");
Q_(4,2,"Qual célula produz mielina no SNC?",["Oligodendrócito","Célula de Schwann","Astrócito","Micróglia"],0,"No SNC a mielina é produzida pelos oligodendrócitos.","Oligodendrócito = Central (SNC); Schwann = periférico.");
Q_(4,2,"Qual célula produz mielina nos nervos do SNP?",["Micróglia","Astrócito","Célula de Schwann","Oligodendrócito"],2,"No SNP a mielina é produzida pelas células de Schwann.","Schwann = periférico (SNP).");
Q_(5,2,"Nervos e gânglios fazem parte do:",["SNC","SNP","Encéfalo","Medula espinhal"],1,"Nervos e gânglios formam o sistema nervoso periférico.","Periférico = “pelas bordas” do corpo.");
Q_(2,2,"Ao tocar numa panela quente, qual estrutura do neurônio recebe o estímulo inicialmente?",["Dendritos","Terminações do axônio","Bainha de mielina","Espaço sináptico"],0,"Os dendritos recebem os estímulos e iniciam o caminho do impulso.","Dendritos = entrada.");
Q_(4,2,"A micróglia atua na defesa do sistema nervoso central.",VF,0,"A micróglia faz fagocitose de microrganismos e restos celulares.","Micróglia = segurança do SNC.",0,"vf");
Q_(3,2,"Os neurotransmissores se ligam a quais estruturas do neurônio seguinte?",["Receptores","Bainha de mielina","Gânglios","Núcleo"],0,"Os receptores “encaixam” os neurotransmissores, como chave e fechadura.","Receptor recebe, como o nome diz.");
Q_(4,2,"Associe: os astrócitos atuam em…",["Defesa do SNC","Nutrição e sustentação dos neurônios","Mielina no SNP","Condução do impulso"],1,"Os astrócitos sustentam e nutrem os neurônios.","Astro = estrela de apoio.");
Q_(2,3,"Numa doença que destrói a bainha de mielina, o que tende a acontecer com o impulso nervoso?",["Fica mais rápido","Fica mais lento ou falha","Muda de sentido","Nada muda"],1,"Sem mielina o impulso não “salta” e a condução fica lenta ou falha.","Sem capa isolante, o sinal se perde.");
Q_(3,3,"Por que a sinapse química é unidirecional (só vai num sentido)?",["Só o terminal do axônio libera neurotransmissores e só a célula seguinte tem receptores","O impulso volta pelo dendrito","O espaço sináptico é vazio","A mielina bloqueia o retorno"],0,"Quem libera é o terminal do axônio; quem recebe, por meio de receptores, é a célula seguinte.","Um lado solta, o outro lado pega.");
Q_(5,3,"Uma pessoa lesiona um nervo da perna e perde a sensibilidade ali. Qual parte do sistema nervoso foi atingida diretamente?",["SNP","Encéfalo","Cerebelo","Hemisfério cerebral"],0,"Nervos fazem parte do SNP.","Nervo = periférico.");
Q_(5,3,"Gânglios são aglomerados de corpos celulares de neurônios localizados fora do SNC.",VF,0,"Isso mesmo: gânglios ficam no SNP.","Gânglio = “nó” de corpos celulares no SNP.",0,"vf");
Q_(1,3,"Qual estrutura destacada libera neurotransmissores?",["Terminações do axônio","Dendritos","Núcleo","Corpo celular"],0,"As terminações do axônio liberam neurotransmissores na sinapse.","Terminações = saída.","t");
Q_(4,3,"Qual afirmativa sobre as células da glia está correta?",["Conduzem impulsos como os neurônios","Dão suporte, nutrição e proteção aos neurônios","Existem só no SNP","Não existem no encéfalo"],1,"A glia apoia os neurônios; não é ela que conduz os impulsos.","Glia = apoio.");
Q_(2,3,"Os nódulos de Ranvier são:",["Espaços sem mielina ao longo do axônio","Núcleos extras do neurônio","Tipos de neurotransmissor","Gânglios"],0,"São interrupções da bainha de mielina, onde o impulso “salta”.","Ranvier = pontos de salto.");
Q_(1,3,"Um aluno afirma: “o corpo celular conduz o impulso para longe do neurônio”. Qual estrutura realmente faz isso?",["Axônio","Dendrito","Receptor","Célula da glia"],0,"Quem conduz o impulso para outras células é o axônio.","Corpo comanda; axônio conduz.");
Q_(3,3,"Qual é a ordem correta dos eventos na sinapse química?",["Liberação de neurotransmissores → travessia do espaço → ligação aos receptores","Ligação aos receptores → liberação → travessia","Travessia → ligação → liberação","Receptores liberam → axônio recebe → travessia"],0,"O terminal libera, os neurotransmissores atravessam o espaço e se ligam aos receptores.","Libera → atravessa → liga.");
Q_(5,3,"Qual par está CORRETO?",["Medula espinhal – SNP","Encéfalo – SNC","Gânglios – SNC","Nervos – SNC"],1,"Encéfalo e medula são SNC; nervos e gânglios são SNP.","Encéfalo e medula = Central.");

function nsvg(hl,lab,click,ex=""){const f=(k,c)=>hl==k?"#fbbf24":c,g=(k,b)=>`<g class="part" ${click?`onclick="pickP('${k}')"`:""}>${b}</g>`,tx=(x,y,s)=>lab?`<text x="${x}" y="${y}" fill="#e8f0ff" font-size="13">${s}</text>`:"";
return `<svg viewBox="0 0 640 240" role="img" aria-label="Diagrama de um neurônio">`+
g("d",`<path d="M140 105L70 50L40 45M70 50L60 20M135 120L50 120L20 100M50 120L25 145M140 138L70 195L40 205M70 195L65 225" stroke="${f("d","#22d3ee")}" stroke-width="5" stroke-linecap="round" fill="none"/>`)+
